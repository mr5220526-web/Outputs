<!DOCTYPE html>
<html lang="en">
<head>

<title>Loop Output Questions – Chapter 12</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a14;
    --card: #0b1426;
    --border: #1a2d50;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --green: #00ff88;
    --yellow: #ffd700;
    --text: #c8d8f0;
    --muted: #6a85b0;
    --code-bg: #020810;
    --output-bg: #001a0d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body.lang-ur { font-family: 'Noto Nastaliq Urdu', serif; }

  /* ===== HEADER / 3D BRAND ===== */
  header {
    position: relative;
    text-align: center;
    padding: 30px 16px 20px;
    background: linear-gradient(180deg, #010812 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,.04) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: gridMove 12s linear infinite;
  }
  @keyframes gridMove { from{background-position:0 0} to{background-position:30px 30px} }

  .title-3d {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5.5vw, 52px);
    font-weight: 900;
    letter-spacing: 2px;
    position: relative;
    display: inline-block;
    color: #fff;
    text-shadow:
      0 1px 0 #c0c0c0,
      0 2px 0 #b0b0b0,
      0 3px 0 #a0a0a0,
      0 4px 0 #909090,
      0 5px 10px rgba(0,0,0,.6),
      0 0 20px var(--accent),
      0 0 40px rgba(0,212,255,.4);
    animation: float3d 3s ease-in-out infinite;
  }
  @keyframes float3d {
    0%,100% { transform: translateY(0) rotateX(0deg); text-shadow: 0 1px 0 #c0c0c0,0 2px 0 #b0b0b0,0 3px 0 #a0a0a0,0 4px 0 #909090,0 5px 10px rgba(0,0,0,.6),0 0 20px var(--accent),0 0 40px rgba(0,212,255,.4); }
    50% { transform: translateY(-8px) rotateX(8deg); text-shadow: 0 2px 0 #c0c0c0,0 4px 0 #b0b0b0,0 6px 0 #a0a0a0,0 8px 0 #909090,0 12px 20px rgba(0,0,0,.7),0 0 30px var(--accent),0 0 60px rgba(0,212,255,.6); }
  }

  .dev-badge {
    display: inline-block;
    margin-top: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(10px, 2.5vw, 15px);
    letter-spacing: 6px;
    color: var(--accent2);
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--accent2), 0 0 20px rgba(255,107,53,.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

  .subtitle {
    margin-top: 6px;
    font-size: clamp(10px, 2.2vw, 13px);
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 12px;
    background: #07111f;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); font-family:'Orbitron',sans-serif; }
  .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  /* ===== LANG TOGGLE ===== */
  .lang-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .lang-btn {
    padding: 7px 18px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all .25s;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .lang-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,.08);
    box-shadow: 0 0 12px rgba(0,212,255,.2);
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== FILTER TABS ===== */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
    background: #06101e;
  }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-btn {
    white-space: nowrap;
    padding: 5px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 700;
  }

  /* ===== SEARCH ===== */
  .search-wrap {
    padding: 10px 14px;
    background: var(--bg);
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 8px rgba(0,212,255,.15); }
  .search-wrap input::placeholder { color: var(--muted); }

  /* ===== CARDS ===== */
  .questions-grid {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 860px;
    margin: 0 auto;
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
    animation: fadeIn .4s ease both;
  }
  .q-card:hover { border-color: rgba(0,212,255,.3); box-shadow: 0 4px 20px rgba(0,212,255,.06); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

  .q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    background: linear-gradient(135deg, var(--accent), #0088aa);
    color: #000;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
    font-family: 'Orbitron', sans-serif;
  }
  .q-section-tag {
    font-size: 10px;
    color: var(--accent2);
    border: 1px solid rgba(255,107,53,.3);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .q-title { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }
  .chevron {
    color: var(--muted);
    font-size: 16px;
    transition: transform .3s;
    flex-shrink: 0;
  }
  .q-card.open .chevron { transform: rotate(180deg); }

  .q-body { display: none; padding: 0; }
  .q-card.open .q-body { display: block; }

  /* Code block */
  .code-block {
    background: var(--code-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
    font-size: 12.5px;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
    color: #a0c4ff;
    border-left: 3px solid var(--accent);
  }
  .kw { color: #ff79c6; }
  .fn { color: #50fa7b; }
  .num { color: #f1fa8c; }
  .str { color: #f1fa8c; }
  .cmt { color: #6272a4; }

  /* Output block */
  .output-block {
    background: var(--output-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px;
  }
  .output-label {
    font-size: 10px;
    color: var(--green);
    letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .output-label::before { content:''; display:inline-block; width:6px; height:6px; background:var(--green); border-radius:50%; animation:blink 1s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  .output-value {
    font-size: 13px;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    white-space: pre;
    line-height: 1.7;
  }

  /* Explanation block */
  .explain-block {
    padding: 12px 14px;
  }
  .explain-label {
    font-size: 10px;
    color: var(--yellow);
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .explain-text {
    font-size: 13px;
    color: #c0d4ee;
    line-height: 1.75;
  }
  .explain-text.ur-text {
    font-family: 'Noto Nastaliq Urdu', serif;
    font-size: 15px;
    direction: rtl;
    text-align: right;
    line-height: 2.2;
  }

  /* Trace table */
  .trace-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-size: 12px;
  }
  .trace-table th {
    background: rgba(0,212,255,.1);
    color: var(--accent);
    padding: 5px 8px;
    text-align: center;
    border: 1px solid var(--border);
    font-size: 11px;
  }
  .trace-table td {
    padding: 4px 8px;
    text-align: center;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .trace-table tr:nth-child(even) td { background: rgba(255,255,255,.02); }

  /* Footer */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  footer span { color: var(--accent); font-family: 'Orbitron', sans-serif; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .hidden { display: none !important; }
  .no-results { text-align:center; color:var(--muted); padding:40px; font-size:14px; }

  /* Progress */
  .progress-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.5s ease;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }
</style>
</head>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en')">🇬🇧 English</button>
  <button class="lang-btn" onclick="setLang('ru')">🇵🇰 Roman Urdu</button>

<script>
const DATA = [
  {
    id:1, qNum:"Q4", section:"While Loop", tag:"while",
    title:"Determine the output of the following code (i=10, while i<=10)",
    code:`int i;\ni = 10;\nwhile (i <= 10)\n{\n    printf("%d", i);\n    i++;\n}`,
    output:`10`,
    explain:{
      en:`i starts at 10. Condition: 10 <= 10 → TRUE. So printf prints 10, then i becomes 11. Now 11 <= 10 → FALSE. Loop ends. Only ONE number printed: 10.`,
      ru:`i ki value 10 hai. Condition check karo: 10 <= 10 → SACH. Printf 10 print karta hai, phir i++ se i=11 ho jata hai. Ab 11 <= 10 → JHOOT. Loop khatam. Sirf ek baar 10 print hoga.`,
      ur:`i کی قدر 10 ہے۔ شرط: 10 <= 10 سچ ہے۔ printf 10 پرنٹ کرتا ہے، پھر i++ سے i=11 ہو جاتا ہے۔ اب 11 <= 10 غلط ہے۔ لوپ ختم۔ صرف 10 پرنٹ ہوا۔`
    },
    trace:[["i","Condition","Output"],["10","10<=10 ✓","10"],["11","11<=10 ✗","–"]]
  },
  {
    id:2, qNum:"Q5", section:"While Loop", tag:"while",
    title:"Determine the output (print Pakistan, j starts 0, step +2)",
    code:`int j = 0;\nwhile (j <= 10)\n{\n    printf("Pakistan\\n");\n    j = j + 2;\n}`,
    output:`Pakistan\nPakistan\nPakistan\nPakistan\nPakistan\nPakistan`,
    explain:{
      en:`j starts at 0. Each iteration j increases by 2. Values of j: 0,2,4,6,8,10 — all <= 10. That's 6 iterations, so "Pakistan" is printed 6 times. When j=12, condition fails.`,
      ru:`j 0 se shuru hota hai, har baar 2 badhta hai. j ki values: 0,2,4,6,8,10 — yeh sab 10 se chhote ya barabar hain. Total 6 baar loop chalta hai, toh "Pakistan" 6 baar print hoga. Jab j=12, condition fail ho jati hai.`,
      ur:`j صفر سے شروع ہوتا ہے، ہر بار 2 بڑھتا ہے۔ j کی اقدار: 0,2,4,6,8,10 — یہ سب 10 سے کم یا برابر ہیں۔ کل 6 بار لوپ چلتا ہے، اس لیے "Pakistan" 6 بار پرنٹ ہوگا۔`
    },
    trace:[["j","j<=10?","Print"],["0","✓","Pakistan"],["2","✓","Pakistan"],["4","✓","Pakistan"],["6","✓","Pakistan"],["8","✓","Pakistan"],["10","✓","Pakistan"],["12","✗","—"]]
  },
  {
    id:3, qNum:"Q6", section:"While Loop / For Loop", tag:"for",
    title:"Determine the output (for x=1, x<=15, x++ inside + x++ in loop body)",
    code:`int x = 0;\nfor (x = 1; x <= 15; x++)\n{\n    printf("%d\\n", x * x);\n    x++;\n}`,
    output:`1\n9\n25\n49\n81\n121\n169\n225`,
    explain:{
      en:`x increments TWICE per iteration: once by x++ in the for header, once by x++ inside the body. So x goes: 1→print 1², x becomes 2 in body, then for does x++ → 3. Then 3²=9, x→4→5, 5²=25, x→6→7, 7²=49, x→8→9, 9²=81, x→10→11, 11²=121, x→12→13, 13²=169, x→14→15, 15²=225, x→16→17 > 15 stop.`,
      ru:`x do baar badhta hai: ek baar loop ke andar x++, ek baar for header mein x++. Isliye x ki values: 1,3,5,7,9,11,13,15 hoti hain. Inke squares print hote hain: 1,9,25,49,81,121,169,225.`,
      ur:`x دو بار بڑھتا ہے: ایک بار لوپ کے اندر x++، ایک بار for ہیڈر میں x++۔ اس لیے x کی اقدار: 1,3,5,7,9,11,13,15 ہوتی ہیں۔ ان کے مربع پرنٹ ہوتے ہیں: 1,9,25,49,81,121,169,225۔`
    },
    trace:[["x (start of iter)","x*x printed","x after body++","x after for++"],["1","1","2","3"],["3","9","4","5"],["5","25","6","7"],["7","49","8","9"],["9","81","10","11"],["11","121","12","13"],["13","169","14","15"],["15","225","16","17 > 15 STOP"]]
  },
  {
    id:4, qNum:"Q7", section:"While Loop", tag:"while",
    title:"Write output (two-column table: k and 10-k, k=0 to 5)",
    code:`int k = 0;\nwhile (k <= 5)\n{\n    printf("%3d%3d\\n", k, 10 - k);\n    k++;\n}`,
    output:`  0 10\n  1  9\n  2  8\n  3  7\n  4  6\n  5  5`,
    explain:{
      en:`k goes from 0 to 5 (6 iterations). Each time it prints k and (10-k) side by side. When k=0: 0 and 10. When k=5: 5 and 5. Notice the two numbers always add up to 10!`,
      ru:`k 0 se 5 tak jata hai (6 baar). Har baar k aur (10-k) ek saath print hota hai. k=0 par: 0 aur 10. k=5 par: 5 aur 5. Dono numbers milake hamesha 10 bante hain!`,
      ur:`k صفر سے 5 تک جاتا ہے (6 بار)۔ ہر بار k اور (10-k) ایک ساتھ پرنٹ ہوتا ہے۔ k=0 پر: 0 اور 10۔ k=5 پر: 5 اور 5۔ دونوں نمبر ملا کر ہمیشہ 10 بنتے ہیں!`
    },
    trace:[["k","10-k"],["0","10"],["1","9"],["2","8"],["3","7"],["4","6"],["5","5"]]
  },
  {
    id:5, qNum:"Q13", section:"While Loop", tag:"while",
    title:"Predict output (print 'Yes' while k<=5, k starts 1)",
    code:`int k = 1;\nwhile (k <= 5)\n{\n    printf("Yes");\n    k++;\n}`,
    output:`YesYesYesYesYes`,
    explain:{
      en:`k starts at 1, goes up to 5. That's 5 iterations. Each iteration prints "Yes" without newline (no \\n). So all 5 "Yes" appear on one line: YesYesYesYesYes.`,
      ru:`k 1 se shuru, 5 tak jata hai — 5 baar. Har baar "Yes" print hota hai lekin \\n (new line) nahi hai, isliye sab ek hi line par aate hain: YesYesYesYesYes.`,
      ur:`k 1 سے شروع، 5 تک جاتا ہے — 5 بار۔ ہر بار "Yes" پرنٹ ہوتا ہے لیکن \\n (نئی لائن) نہیں ہے، اس لیے سب ایک لائن پر: YesYesYesYesYes۔`
    }
  },
  {
    id:6, qNum:"Q14", section:"While Loop", tag:"while",
    title:"Predict output (x starts 3, condition x<=12, step x+2)",
    code:`int x = 3;\nwhile (x <= 12)\n{\n    printf("x is %d\\n", x);\n    x = x + 2;\n}`,
    output:`x is 3\nx is 5\nx is 7\nx is 9\nx is 11`,
    explain:{
      en:`x starts at 3, increases by 2 each time. Values: 3,5,7,9,11 — all <= 12. When x=13, condition fails. Notice x=12 is skipped because 12 is even and x steps by 2 from odd start (3).`,
      ru:`x 3 se shuru, har baar 2 badhta hai. Values: 3,5,7,9,11. Jab x=13, loop khatam. x=12 kabhi nahi aata kyunki x odd numbers par chalta hai.`,
      ur:`x 3 سے شروع، ہر بار 2 بڑھتا ہے۔ اقدار: 3,5,7,9,11۔ جب x=13، لوپ ختم۔ x=12 کبھی نہیں آتا کیونکہ x طاق اعداد پر چلتا ہے۔`
    },
    trace:[["x","x<=12?"],["3","✓ print"],["5","✓ print"],["7","✓ print"],["9","✓ print"],["11","✓ print"],["13","✗ stop"]]
  },
  {
    id:7, qNum:"Q15", section:"While Loop", tag:"while",
    title:"Determine output (while x<=5 OR y>=1, x starts 1, y starts 10)",
    code:`int x = 1;\nint y = 10;\nwhile (x <= 5 || y >= 1)\n{\n    printf("%d - %d\\n", x, y);\n    x = x + 1;\n    y = y - 1;\n}`,
    output:`1 - 10\n2 - 9\n3 - 8\n4 - 7\n5 - 6\n6 - 5\n7 - 4\n8 - 3\n9 - 2\n10 - 1`,
    explain:{
      en:`The OR (||) means loop continues as long as EITHER condition is true. x goes 1→10, y goes 10→1. Even when x>5, y>=1 keeps loop running. Loop stops when BOTH x<=5 is false AND y>=1 is false (i.e., x=11, y=0).`,
      ru:`OR (||) matlab loop tab tak chalta hai jab tak koi ek condition sach ho. x 1 se 10 tak, y 10 se 1 tak jata hai. x>5 hone ke baad bhi y>=1 ki wajah se loop chalta rahta hai. Tab rokta hai jab dono conditions jhoot ho jayen.`,
      ur:`OR (||) کا مطلب ہے لوپ تب تک چلتا ہے جب تک کوئی ایک شرط سچ ہو۔ x 1 سے 10 تک، y 10 سے 1 تک جاتا ہے۔ لوپ اس وقت رکتا ہے جب دونوں شرطیں غلط ہو جائیں۔`
    }
  },
  {
    id:8, qNum:"Q20", section:"While Loop", tag:"while",
    title:"Write output (infinite loop — n=10, n>=1 but n never decremented)",

let currentLang = 'en';
let currentFilter = 'all';

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderAll();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderAll();
}

function doSearch() { renderAll(); }

function renderAll() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const grid = document.getElementById('qGrid');
  const noRes = document.getElementById('noRes');
  grid.innerHTML = '';
  let count = 0;
  DATA.forEach((q, idx) => {
    if (currentFilter !== 'all' && q.tag !== currentFilter) return;
    const titleCheck = q.title.toLowerCase().includes(search);
    const codeCheck = q.code.toLowerCase().includes(search);
    const numCheck = q.qNum.toLowerCase().includes(search);
    if (search && !titleCheck && !codeCheck && !numCheck) return;
    count++;
    grid.insertAdjacentHTML('beforeend', buildCard(q, idx));
  });
  noRes.classList.toggle('hidden', count > 0);

  // Re-attach toggle events
  grid.querySelectorAll('.q-header').forEach(h => {
    h.addEventListener('click', () => {
      const card = h.closest('.q-card');
      card.classList.toggle('open');
    });
  });

  // Update progress bar
  const prog = document.getElementById('progBar');
  prog.style.width = '100%';
  setTimeout(() => prog.style.width = '0%', 600);
}

function buildCard(q, idx) {
  const explainText = q.explain[currentLang] || q.explain['en'];
  const isUrdu = currentLang === 'ur';
  const explainClass = isUrdu ? 'explain-text ur-text' : 'explain-text';

  const langLabels = {
    en: { output: 'OUTPUT', explain: 'EXPLANATION', trace: 'TRACE TABLE' },
    ru: { output: 'OUTPUT / NATIJA', explain: 'WAZAHAT / EXPLANATION', trace: 'TRACE TABLE' },
    ur: { output: 'آؤٹ پٹ', explain: 'وضاحت', trace: 'ٹریس ٹیبل' }
  };
  const lbl = langLabels[currentLang];

  let traceHtml = '';
  if (q.trace) {
    const headers = q.trace[0];
    const rows = q.trace.slice(1);
    traceHtml = `<div style="padding:10px 14px; border-bottom:1px solid var(--border)">
      <div class="explain-label">${lbl.trace}</div>
      <div style="overflow-x:auto">
      <table class="trace-table">
        <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div>`;
  }

  return `
  <div class="q-card" id="card-${q.id}" style="animation-delay:${idx*0.04}s">
    <div class="q-header">
      <span class="q-num">${q.qNum}</span>
      <span class="q-section-tag">${q.section}</span>
      <span class="q-title">${q.title}</span>
      <span class="chevron">▾</span>
    </div>
    <div class="q-body">
      <div class="code-block">${escapeHtml(q.code)}</div>
      <div class="output-block">
        <div class="output-label">${lbl.output}</div>
        <div class="output-value">${escapeHtml(q.output)}</div>
      </div>
      ${traceHtml}
      <div class="explain-block">
        <div class="explain-label">💡 ${lbl.explain}</div>
        <div class="${explainClass}">${explainText}</div>
      </div>
    </div>
  </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Scroll progress
window.addEventListener('scroll', () => {
  const scrollTop = document.documentElement.scrollTop;
  const docH = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const prog = document.getElementById('progBar');
  prog.style.width = (scrollTop / docH * 100) + '%';
});

// Initial render
renderAll();
</script>
